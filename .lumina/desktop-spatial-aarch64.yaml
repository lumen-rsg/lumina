      size: 341436
      sha256: 90b54d9dd6baf7c2aa8256232ec5eb5abcf5039ea3f87fc618e9047941f2be78
    targets:
    - fedora-44-aarch64
    promotion_group: cassiopeia-spatial-26.9-aarch64
