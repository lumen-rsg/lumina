# The noarch desktop update uses the already-published release and desktop stack.
# Rebuilding an unchanged lumina-release would republish an existing NEVRA.
version: 1
packages:
  lumina-desktop:
    spec: desktop/lumina-desktop/lumina-desktop.spec
    paths:
      - desktop/lumina-desktop/**
      - .lumina/desktop-installer.yaml
    targets:
      - fedora-44-x86_64
    promotion_group: cassiopeia-installer-26.9
