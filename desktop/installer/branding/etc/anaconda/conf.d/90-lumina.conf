[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/lumina.css
can_change_users = True
hidden_spokes = PasswordSpoke

[Payload]
default_environment = lumina-desktop-environment
# Anaconda interpolates VERSION_ID from the target, which is Lumina 26.9.
# Fedora's signing key follows the base release, not Lumina's release number.
default_rpm_gpg_keys =
    /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-44-$basearch
    /etc/pki/rpm-gpg/RPM-GPG-KEY-lumina-2026
    /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020
    /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
