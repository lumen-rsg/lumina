# Lumina defaults for Fedora's Ly 1.4 display manager.
# Keep authentication interactive and offer the installed Wayland sessions.
allow_empty_password = false
animation = none
auth_fails = 0
initial_info_text = Lumina 26.9 Cassiopeia
hide_version_string = true
bg = 0x00161724
fg = 0x00E7E7F7
border_fg = 0x00B7A4F4
text_in_center = true
save = true
service_name = ly
shell = false
xinitrc = null
xsessions = null
waylandsessions = /usr/share/wayland-sessions
setup_cmd = /bin/sh /etc/ly/setup.sh
login_cmd = null
session_log = .local/state/ly-session.log
